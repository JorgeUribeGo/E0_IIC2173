upstream master_backend {
    server 127.0.0.1:3001;
    server 127.0.0.1:3002;
}

server {
    server_name tiburonshark.me;

    location / {
        proxy_pass http://master_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/tiburonshark.me/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/tiburonshark.me/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = tiburonshark.me) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name tiburonshark.me;
    return 404; # managed by Certbot


}
